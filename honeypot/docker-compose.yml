version: "3.8"
services:
  cowrie:
    build: .
    container_name: cowrie
    restart: unless-stopped
    ports:
      - "2222:2222"
    volumes:
      - ./cowrie/data:/cowrie/data
      - ./cowrie/cowrie.cfg:/etc/cowrie/cowrie.cfg:ro
    environment:
      - TZ=UTC
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
